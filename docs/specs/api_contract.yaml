components:
  schemas:
    EstadoEquipo:
      type: string
      enum:
        - disponible
        - alquilado
        - mantenimiento
        - baja

    EstadoAlquiler:
      type: string
      enum:
        - activo
        - finalizado
        - vencido

    TipoNotificacion:
      type: string
      enum:
        - vencimiento_proximo
        - vencido
        - recordatorio

    ClienteBase:
      type: object
      properties:
        nombre_empresa:
          type: string
          minLength: 1
          maxLength: 200
        razon_social:
          type: string
          maxLength: 200
          nullable: true
        rut_cuit:
          type: string
          maxLength: 20
          nullable: true
        persona_contacto:
          type: string
          maxLength: 200
          nullable: true
        telefono:
          type: string
          maxLength: 50
          nullable: true
        email:
          type: string
          maxLength: 200
          nullable: true
        direccion:
          type: string
          maxLength: 500
          nullable: true
        observaciones:
          type: string
          maxLength: 1000
          nullable: true
      required:
        - nombre_empresa

    ClienteCreate:
      allOf:
        - $ref: '#/components/schemas/ClienteBase'

    ClienteUpdate:
      type: object
      properties:
        nombre_empresa:
          type: string
          minLength: 1
          maxLength: 200
        razon_social:
          type: string
          maxLength: 200
          nullable: true
        rut_cuit:
          type: string
          maxLength: 20
          nullable: true
        persona_contacto:
          type: string
          maxLength: 200
          nullable: true
        telefono:
          type: string
          maxLength: 50
          nullable: true
        email:
          type: string
          maxLength: 200
          nullable: true
        direccion:
          type: string
          maxLength: 500
          nullable: true
        observaciones:
          type: string
          maxLength: 1000
          nullable: true

    Cliente:
      allOf:
        - $ref: '#/components/schemas/ClienteBase'
        - type: object
          properties:
            id:
              type: integer
            fecha_creacion:
              type: string
              format: date-time
            fecha_actualizacion:
              type: string
              format: date-time

    EquipoBase:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        codigo:
          type: string
          minLength: 1
          maxLength: 50
        descripcion:
          type: string
          maxLength: 1000
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoEquipo'
        precio_diario:
          type: number
          format: float
          minimum: 0
        observaciones:
          type: string
          maxLength: 1000
          nullable: true
      required:
        - nombre
        - codigo
        - precio_diario

    EquipoCreate:
      allOf:
        - $ref: '#/components/schemas/EquipoBase'

    EquipoUpdate:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        codigo:
          type: string
          minLength: 1
          maxLength: 50
        descripcion:
          type: string
          maxLength: 1000
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoEquipo'
        precio_diario:
          type: number
          format: float
          minimum: 0
        observaciones:
          type: string
          maxLength: 1000
          nullable: true

    Equipo:
      allOf:
        - $ref: '#/components/schemas/EquipoBase'
        - type: object
          properties:
            id:
              type: integer
            fecha_creacion:
              type: string
              format: date-time
            fecha_actualizacion:
              type: string
              format: date-time

    AlquilerBase:
      type: object
      properties:
        cliente_id:
          type: integer
        fecha_inicio:
          type: string
          format: date
        fecha_devolucion_prevista:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoAlquiler'
        observaciones:
          type: string
          maxLength: 1000
          nullable: true
      required:
        - cliente_id
        - fecha_inicio
        - fecha_devolucion_prevista

    AlquilerCreate:
      type: object
      properties:
        cliente_id:
          type: integer
        fecha_inicio:
          type: string
          format: date
        fecha_devolucion_prevista:
          type: string
          format: date
        observaciones:
          type: string
          maxLength: 1000
          nullable: true
        equipos_ids:
          type: array
          items:
            type: integer
          minItems: 1
      required:
        - cliente_id
        - fecha_inicio
        - fecha_devolucion_prevista
        - equipos_ids

    AlquilerUpdate:
      type: object
      properties:
        fecha_inicio:
          type: string
          format: date
          nullable: true
        fecha_devolucion_prevista:
          type: string
          format: date
          nullable: true
        fecha_devolucion_real:
          type: string
          format: date
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoAlquiler'
          nullable: true
        observaciones:
          type: string
          maxLength: 1000
          nullable: true

    Alquiler:
      allOf:
        - $ref: '#/components/schemas/AlquilerBase'
        - type: object
          properties:
            id:
              type: integer
            fecha_creacion:
              type: string
              format: date-time
            fecha_actualizacion:
              type: string
              format: date-time
            equipos:
              type: array
              items:
                $ref: '#/components/schemas/Equipo'

    AlquilerDetalle:
      allOf:
        - $ref: '#/components/schemas/Alquiler'
        - type: object
          properties:
            cliente:
              $ref: '#/components/schemas/Cliente'

    NotificacionBase:
      type: object
      properties:
        alquiler_id:
          type: integer
        tipo:
          $ref: '#/components/schemas/TipoNotificacion'
        mensaje:
          type: string
          maxLength: 500
        leida:
          type: boolean
      required:
        - alquiler_id
        - tipo
        - mensaje

    NotificacionCreate:
      allOf:
        - $ref: '#/components/schemas/NotificacionBase'

    Notificacion:
      allOf:
        - $ref: '#/components/schemas/NotificacionBase'
        - type: object
          properties:
            id:
              type: integer
            fecha_creacion:
              type: string
              format: date-time
            fecha_actualizacion:
              type: string
              format: date-time

    AlquilerFilters:
      type: object
      properties:
        cliente_id:
          type: integer
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoAlquiler'
          nullable: true
        fecha_inicio_desde:
          type: string
          format: date
          nullable: true
        fecha_inicio_hasta:
          type: string
          format: date
          nullable: true
        buscar:
          type: string
          nullable: true

    ClienteFilters:
      type: object
      properties:
        buscar:
          type: string
          nullable: true

    EquipoFilters:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/EstadoEquipo'
          nullable: true
        buscar:
          type: string
          nullable: true

    DashboardResumen:
      type: object
      properties:
        total_clientes:
          type: integer
        total_equipos:
          type: integer
        equipos_disponibles:
          type: integer
        equipos_alquilados:
          type: integer
        alquileres_activos:
          type: integer
        alquileres_vencidos:
          type: integer
        notificaciones_pendientes:
          type: integer
        ingresos_mes:
          type: number
          format: float

    PaginatedResponseCliente:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cliente'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedResponseEquipo:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Equipo'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedResponseAlquiler:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alquiler'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedResponseNotificacion:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notificacion'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    Error:
      type: object
      properties:
        detail:
          type: string

    ValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string
